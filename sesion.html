<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="style3.css">
</head>

<body>
    <div class="contenedor-principal">

        <img src="imagenes/logo.jpeg" alt="Logo M&H" class="logo">

        <div class="card">
            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Creá tu espacio de bienestar
            </p>

            <form id="form-registro">

                <div class="grupo-input">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre"
                        placeholder="Tu nombre y apellido"
                        autocomplete="name" required>
                </div>

                <div class="grupo-input">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email"
                        placeholder="tu@email.com"
                        autocomplete="email" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password"
                        placeholder="Creá una contraseña"
                        autocomplete="new-password"
                        minlength="8" required>
                </div>

                <div class="grupo-input">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" name="confirmar"
                        placeholder="Repetí tu contraseña"
                        autocomplete="new-password"
                        minlength="8" required>
                </div>

                <button type="submit" class="btn-registro">
                    Crear cuenta
                </button>

                <p id="mensaje" role="status"></p>

                <p class="iniciar-cuenta">
                    ¿Ya tenés cuenta?
                    <a href="registrarse.html">Iniciar sesión</a>
                </p>

            </form>
        </div>
    </div>

    <script>
        const formulario = document.getElementById("form-registro");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmar = document.getElementById("confirmar").value;

            if (password !== confirmar) {
                mensaje.textContent = "Las contraseñas no coinciden.";
                return;
            }

            if (password.length < 8) {
                mensaje.textContent =
                    "La contraseña debe tener al menos 8 caracteres.";
                return;
            }

            mensaje.textContent = "Creando cuenta...";

            try {
                const respuesta = await fetch("api/registro.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        email: email,
                        password: password
                    })
                });

                const datos = await respuesta.json();
                console.log("respuesta del registro:", respuesta.status, datos)

                mensaje.textContent =
                    datos.mensaje || datos.error ||
                    (respuesta.ok
                        ? "Solicitud procesada."
                        : "No se pudo crear la cuenta.");

                if (respuesta.ok && respuesta.status==201) {
                    formulario.reset();
                    window.location.href = "registrarse.html";
                }

            } catch (error) {
                mensaje.textContent =
                    "No se pudo conectar con el servidor. Revisá que Apache esté activo y la ruta de la API sea correcta.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
