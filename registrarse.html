<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <div class="contenedor-principal">
        <img src="imagenes/logo.jpeg" alt="MYH logo" class="logo">

        <div class="card">
            <h1>Iniciar sesion</h1>

            <form id="form-login" action="#" method="post">
                <div class="grupo-input">

                    <label for="email">Correo electronico:</label>
                    <input type="email" id="email" name="email"
                        placeholder="tu@email.com" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contrasena:</label>
                    <input type="password" id="password" name="password"
                        placeholder="Ingresa tu Contrasena" required>
                </div>

                <nav class="main-nav">
                    <a href="#" onclick="document.getElementById('form-login').requestSubmit(); return false;">
                        iniciar sesion
                    </a>
                </nav>

                <p id="mensaje"></p>

                <p class="crear-cuenta">
                    ¿No tenes cuenta?<a href="sesion.php">Crear cuenta</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("form-login").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const mensaje = document.getElementById("mensaje");

            try {
                const respuesta = await fetch("api/login.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const datos = await respuesta.json();

                mensaje.textContent = datos.mensaje || datos.error ||
                    "No se pudo iniciar sesión.";

                if (respuesta.ok && datos.success) {
                    window.location.href = "inicio.php";
                }
            } catch (error) {
                mensaje.textContent =
                    "No se pudo conectar con el servidor.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
