<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <div class="contenedor-principal">

        <img src="imagenes/logo.jpeg" alt="Logo M&H" class="logo">

        <div class="card">
            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Creá tu espacio de bienestar
            </p>

            <form action="#" method="post">

                <div class="grupo-input">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" autocomplete="name" required >
                </div>

                <div class="grupo-input">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Creá una contraseña" autocomplete="new-password" required>
                </div>

                <div class="grupo-input">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repetí tu contraseña" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-registro">
                    Crear cuenta
                </button>

                <p class="iniciar-cuenta">
                    ¿Ya tenés cuenta?
                    <a href="login.html">Iniciar sesión</a>
                </p>

            </form>
        </div>
    </div>
</body>
</html>
